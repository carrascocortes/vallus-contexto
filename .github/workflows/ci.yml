name: ci

on:
  push:
    branches: ['**']
    tags: ['**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trava:
    name: trava sobre cada commit do push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Baixa o gitleaks (binário pinado + checksum)
        run: |
          VER=8.30.1
          ASSET="gitleaks_${VER}_linux_x64.tar.gz"
          EXPECTED_SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ASSET}"
          echo "${EXPECTED_SHA}  ${ASSET}" > "${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          tar -xzf "$ASSET" gitleaks

      - name: Testes
        env:
          VALLUS_GITLEAKS: ${{ runner.temp }}/gitleaks
        run: node --test testes/*.test.mjs

      - name: Trava
        env:
          VALLUS_GITLEAKS: ${{ runner.temp }}/gitleaks
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .githooks/trava.mjs --push "$BEFORE" "$AFTER"

  aviso:
    name: aviso dos caminhos vigiados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Aviso
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .githooks/aviso.mjs "$BEFORE" "$AFTER"
